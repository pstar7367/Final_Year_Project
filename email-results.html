<script>
let currentResults = [];
const MAX_EMAILS_TO_SHOW = 50;
lucide.createIcons();

function safeParseJSON(value, fallback) {
    try {
        return JSON.parse(value);
    } catch (e) {
        return fallback;
    }
}

let latestBackendCount = 0;

function getEmailDedupKey(email) {
    const messageId = String(getEmailField(email, ['Message_ID', 'Message ID', 'MessageId', 'msgId', 'message_id']) || '').trim().toLowerCase();
    const date = getEmailField(email, ['Date', 'Email Date']) || '';
    const sender = getEmailField(email, ['From', 'Sender', 'Email From']) || '';
    const subject = getEmailField(email, ['Subject', 'Email Subject']) || '';
    if (messageId) return `msgid:${messageId}`;
    return normalizeEmailKey([date, sender, subject]);
}

function dedupeEmails(emails) {
    const seen = new Set();
    return (Array.isArray(emails) ? emails : []).filter((email, idx) => {
        /* Only deduplicate when a stable Message-ID is present.
           date|sender|subject keys are NOT used for dedup because multiple
           legitimate emails can share the same sender+subject on the same day,
           which caused the count to drop from 50 → 48/49. */
        const key = getEmailDedupKey(email);
        if (!key || !key.startsWith('msgid:')) return true;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
    });
}

function setTotalCount() {
    const totalCountEl = document.getElementById('totalCount');
    if (!totalCountEl) return;
    totalCountEl.innerText = (currentResults && currentResults.length) ? currentResults.length : 0;
}

/* ================= ACTIVITY LOGGER ================= */
function logActivity(message) {
    const logs = JSON.parse(localStorage.getItem("activityLogs")) || [];

    logs.unshift({
        message: message,
        time: new Date().toLocaleString()
    });

    if (logs.length > 100) logs.pop();

    localStorage.setItem("activityLogs", JSON.stringify(logs));
}

function initActivityTracking() {
    document.body.addEventListener('click', function (event) {
        const anchor = event.target.closest('a');
        if (anchor && anchor.href) {
            logActivity(`Clicked navigation link: ${anchor.textContent.trim() || anchor.href}`);
            return;
        }

        const button = event.target.closest('button,input[type="button"],input[type="submit"]');
        if (button) {
            logActivity(`Clicked button: ${button.textContent.trim()}`);
        }
    }, true);
}

function initStats() {
    if (!localStorage.getItem("stats")) {
        localStorage.setItem("stats", JSON.stringify({
            emails: 0,
            transactions: 0,
            alerts: 0,
            reports: 0,
            phishing: 0,
            potential: 0,
            dailyHistory: {}
        }));
    }
}

function resetProjectCountsOnce() {
    const resetKey = "secureTraceResetVersion";
    const resetVersion = "email-performance-reset-v3";

    if (localStorage.getItem(resetKey) === resetVersion) return;

    // Preserve emailAnalysisResults so reports still see the same data.
    // localStorage.removeItem("emailAnalysisResults");
    localStorage.removeItem("recentAnalysis");
    localStorage.setItem("stats", JSON.stringify({
        emails: 0,
        transactions: 0,
        alerts: 0,
        reports: 0,
        phishing: 0,
        potential: 0,
        dailyHistory: {}
    }));
    localStorage.setItem(resetKey, resetVersion);
}

function getStats() {
    initStats();
    const stats = JSON.parse(localStorage.getItem("stats"));
    stats.emails = stats.emails || 0;
    stats.transactions = stats.transactions || 0;
    stats.alerts = stats.alerts || 0;
    stats.reports = stats.reports || 0;
    stats.phishing = stats.phishing !== undefined ? stats.phishing : stats.alerts;
    stats.potential = stats.potential !== undefined ? stats.potential : 0;
    let needsSave = false;
    if (!stats.dailyHistory || Array.isArray(stats.dailyHistory)) {
        stats.dailyHistory = {};
        needsSave = true;
    }
    if (needsSave) {
        setStats(stats);
    }
    return stats;
}

function setStats(data) {
    localStorage.setItem("stats", JSON.stringify(data));
}

function saveRecentAnalysis(records) {
    localStorage.setItem('recentAnalysis', JSON.stringify(records));
}

function getActualLabels() {
    try {
        const stored = localStorage.getItem("actualEmailLabels");
        const parsed = JSON.parse(stored) || {};
        const normalized = normalizeLabelMap(parsed);
        console.log('[GET] actualEmailLabels retrieved:', normalized);
        return normalized;
    } catch (err) {
        console.error('[GET] Error parsing actualEmailLabels:', err);
        return {};
    }
}
function normalizeEmailKey(parts) {
    return parts.map(p => String(p || '').trim().toLowerCase()).join('|');
}
function normalizeLabelKey(key) {
    const value = String(key || '').trim().toLowerCase();
    if (!value) return '';
    return value.replace(/\s*\|\s*/g, '|');
}
function normalizeLabelMap(labels) {
    const normalized = {};
    Object.keys(labels || {}).forEach(k => {
        const normalizedKey = normalizeLabelKey(k);
        if (normalizedKey) normalized[normalizedKey] = labels[k];
    });
    return normalized;
}

function getAllEmailAnalysisResults() {
    try {
        const stored = localStorage.getItem("emailAnalysisResults");
        const parsed = JSON.parse(stored);
        return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
        console.error('[CACHE] Error parsing emailAnalysisResults:', err);
        return [];
    }
}

function saveActualLabels(labels) {
    const normalized = {};
    Object.keys(labels || {}).forEach(k => {
        const normalizedKey = normalizeLabelKey(k);
        if (normalizedKey) normalized[normalizedKey] = normalizeActualLabel(labels[k]);
    });
    const json = JSON.stringify(normalized);
    localStorage.setItem("actualEmailLabels", json);
    console.log('[SAVE] actualEmailLabels stored:', normalized);
    const verify = localStorage.getItem("actualEmailLabels");
    console.log('[SAVE] Verified read back:', verify);
}

function getActualLabel(email) {
    const labels = getActualLabels();
    return normalizeActualLabel(getEmailField(email, ['Actual_Label', 'Actual Label', 'Actual', 'Ground Truth', 'True Label']) || getStoredActualLabel(email, labels));
}

function getStoredActualLabel(email, labels = getActualLabels()) {
    const keys = getEmailKeys(email);
    const matchedKey = keys.find(key => labels[key]);
    return matchedKey ? labels[matchedKey] : "";
}

function normalizeActualLabel(value) {
    const label = String(value || "").trim().toUpperCase();
    if (label.includes("PHISH")) return "PHISHING";
    if (label.includes("SAFE") || label.includes("LEGIT")) return "SAFE";
    return "";
}

function getActualLabelsFromAllSources() {
    const labels = { ...getActualLabels() };
    const cachedRecords = getAllEmailAnalysisResults();

    cachedRecords.forEach(email => {
        const actualLabel = normalizeActualLabel(email?.Actual_Label);
        if (!actualLabel) return;

        getEmailKeys(email).forEach(key => {
            labels[key] = actualLabel;
        });
    });

    return labels;
}

function mergeStoredActualLabelsIntoResults(results) {
    const labels = getActualLabelsFromAllSources();
    return (Array.isArray(results) ? results : []).map(email => {
        const actualLabel = normalizeActualLabel(email?.Actual_Label || getStoredActualLabel(email, labels));
        return actualLabel ? { ...email, Actual_Label: actualLabel } : email;
    });
}

function updateActualLabel(emailKey, value) {
    const labels        = getActualLabels();
    const normalizedValue = normalizeActualLabel(value);
    const matchedEmail  = currentResults.find(email => getEmailKeys(email).includes(emailKey));

    /* Save under EVERY key for this email (msgid + canonical) so any
       lookup path finds it, even if key format changes on next load. */
    const keysToSave = matchedEmail ? getEmailKeys(matchedEmail) : [emailKey];

    if (normalizedValue) {
        keysToSave.forEach(key => { labels[key] = normalizedValue; });
    } else {
        keysToSave.forEach(key => { delete labels[key]; });
    }

    console.log('[UPDATE] emailKey:', emailKey, '→', normalizedValue,
        '| stored under keys:', keysToSave);

    saveActualLabels(labels);
    updateCachedActualLabel(emailKey, normalizedValue);
    localStorage.setItem('emailAnalysisResults', JSON.stringify(currentResults));
    renderTable(currentResults);
    saveSnapshot();
    updateLabelCounter();
    logActivity("Updated actual email label");
}

function updateCachedActualLabel(emailKey, value) {
    console.log('[CACHE] Updating cached results with emailKey:', emailKey, 'value:', value);
    currentResults = currentResults.map(email => updateEmailActualLabel(email, emailKey, value));
    console.log('[CACHE] currentResults updated, sample record Actual_Label:', currentResults[0]?.Actual_Label);

    const cachedResults = JSON.parse(localStorage.getItem("emailAnalysisResults")) || [];
    if (Array.isArray(cachedResults)) {
        const updated = cachedResults.map(email => updateEmailActualLabel(email, emailKey, value));
        localStorage.setItem("emailAnalysisResults", JSON.stringify(updated));
        console.log('[CACHE] emailAnalysisResults updated in localStorage');
        console.log('[CACHE] Verified: sample record from cache:', updated[0]?.Actual_Label);
    }
}

function updateEmailActualLabel(email, emailKey, value) {
    if (!getEmailKeys(email).includes(emailKey)) return email;

    if (value) {
        return { ...email, Actual_Label: value };
    }

    const updatedEmail = { ...email };
    delete updatedEmail.Actual_Label;
    return updatedEmail;
}
function getRecentAnalysis() {
    return JSON.parse(localStorage.getItem('recentAnalysis')) || [];
}

function addRecentAnalysis(record) {
    const records = getRecentAnalysis();
    records.unshift(record);
    if (records.length > 10) records.pop();
    saveRecentAnalysis(records);
}

function updateScanStats(emailCount, phishingCount, potentialCount) {
    initStats();
    const stats = getStats();
    const today = getEmailDateKey({ Date_Timestamp: Date.now() });

    stats.emails += emailCount;
    stats.phishing += phishingCount;
    stats.potential += potentialCount;

    if (!stats.dailyHistory || Array.isArray(stats.dailyHistory)) {
        stats.dailyHistory = {};
    }

    stats.dailyHistory[today] = (stats.dailyHistory[today] || 0) + emailCount;
    stats.alerts = stats.phishing + stats.potential;
    setStats(stats);
    logActivity(`Updated stats: +${emailCount} emails, +${phishingCount} phishing, +${potentialCount} potential`);
}

function syncReportDataFromResults(results) {
    /* FIX 5: do NOT slice emailAnalysisResults to MAX_EMAILS_TO_SHOW before
       saving. The old .slice(0, 50) permanently discarded any labels attached
       to emails beyond index 49. Now we save the full array so the ML
       Evaluator in reports.html can see every labeled email. The 50-item cap
       is kept only for stats counters and the recentAnalysis display list. */
    initStats();

    const stats  = getStats();
    const labels = getActualLabels();

    /* Merge stored actual labels into every record — no size cap on the save.
       Stamp _category at save-time so reports.html always has a reliable
       prediction value regardless of field-name differences. */
    const allResults = (Array.isArray(results) ? results : []).map(email => {
        const actualLabel = normalizeActualLabel(email?.Actual_Label || getStoredActualLabel(email, labels));
        const _category   = normalizeCategory(email);
        const enriched    = { ...email, _category };
        return actualLabel ? { ...enriched, Actual_Label: actualLabel } : enriched;
    });

    console.log('[SYNC] syncReportDataFromResults: total=', allResults.length,
        '| with Actual_Label:', allResults.filter(e=>e.Actual_Label).length,
        '| actualEmailLabels keys:', Object.keys(labels).length);

    /* Save the FULL uncapped array so the evaluator sees everything */
    localStorage.setItem('emailAnalysisResults', JSON.stringify(allResults));

    /* Stats and charts only need a representative slice */
    const statsSlice    = allResults.slice(0, MAX_EMAILS_TO_SHOW);
    const phishingCount  = statsSlice.filter(e => normalizeCategory(e) === "PHISHING").length;
    const potentialCount = statsSlice.filter(e => normalizeCategory(e) === "POTENTIAL_PHISHING").length;
    const dailyHistory   = {};
    statsSlice.forEach(email => {
        const key = getEmailDateKey(email);
        if (!key) return;
        dailyHistory[key] = (dailyHistory[key] || 0) + 1;
    });

    stats.emails     = statsSlice.length;
    stats.phishing   = phishingCount;
    stats.potential  = potentialCount;
    stats.alerts     = phishingCount + potentialCount;
    stats.dailyHistory = dailyHistory;
    setStats(stats);

    const recentRecords = [...allResults]
        .sort((a, b) => getEmailTime(b) - getEmailTime(a))
        .slice(0, 10)
        .map(email => ({
            date  : email.Date   || "-",
            sender: email.From   || "-",
            subject: email.Subject || "-",
            status: getEmailStatusLabel(email)
        }));

    saveRecentAnalysis(recentRecords);
    logActivity(`Synced report data from ${allResults.length} email results`);
}

function getEmailField(email, names) {
    const keys = Object.keys(email || {});
    const normalizedLookup = {};

    keys.forEach(key => {
        normalizedLookup[key.toLowerCase().replace(/[\s_-]/g, "")] = email[key];
    });

    for (const name of names) {
        const directValue = email?.[name];
        if (directValue !== undefined && directValue !== null && directValue !== "") return directValue;

        const normalizedName = name.toLowerCase().replace(/[\s_-]/g, "");
        const normalizedValue = normalizedLookup[normalizedName];
        if (normalizedValue !== undefined && normalizedValue !== null && normalizedValue !== "") return normalizedValue;
    }

    return "";
}

function normalizeCategory(email) {
    const label = String(getEmailField(email, ["Category_Label", "Category Label", "Prediction_Label", "Prediction Label", "Label", "Status"]) || "").toLowerCase();
    const category = String(getEmailField(email, ["Category", "Prediction", "Predicted_Label", "Predicted Label", "Predicted", "Result"]) || "").toUpperCase();
    const risk = String(getEmailField(email, ["Risk", "Risk_Level", "Risk Level", "Threat"]) || "").toLowerCase();

    if (label.includes("potential") || category === "POTENTIAL_PHISHING") {
        return "POTENTIAL_PHISHING";
    }

    if (label.includes("phishing") || category === "PHISHING" || risk.includes("phishing")) {
        return "PHISHING";
    }

    return "SAFE";
}

function getEmailTime(email) {
    return Number(getEmailField(email, ["Date_Timestamp", "Date Timestamp", "Timestamp"]) || Date.parse(getEmailField(email, ["Date", "Email Date", "Created At"])) || 0);
}

function getEmailDateKey(email) {
    const time = getEmailTime(email);
    if (!time) return "";

    const date = new Date(time);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function getEmailStatusLabel(email) {
    if (email.Category_Label) return email.Category_Label;
    const category = normalizeCategory(email);
    if (category === "PHISHING") return "Phishing";
    if (category === "POTENTIAL_PHISHING") return "Potential Phishing";
    return "Safe";
}

function getEmailKey(email) {
    return getEmailKeys(email)[0];
}

/* ── ROBUST KEY GENERATION ──────────────────────────────────────────
   ROOT CAUSE FIX: The old key used date|sender|subject.
   Gmail's Date field is a full RFC 2822 string ("Mon, 12 Jan 2025
   10:23:44 +0000 (UTC)"). Any whitespace/timezone difference between
   loads silently broke the match — causing user-set labels to
   disappear on refresh (the "only 4 labels" bug).

   Fix: Message_ID is used as the PRIMARY key. It is a globally unique
   mail identifier that never changes format. The date|sender|subject
   canonical key is kept as a FALLBACK for backward compatibility with
   labels already stored in the old format.

   When a user sets a label, it is saved under EVERY available key so
   both old and new lookup paths find it.
─────────────────────────────────────────────────────────────────── */
function getEmailKeys(email) {
    const messageId = String(
        getEmailField(email, ['Message_ID', 'Message ID', 'MessageId', 'msgId', 'message_id']) || ''
    ).trim();

    const date    = getEmailField(email, ["Date", "Email Date"]) || '';
    const sender  = getEmailField(email, ["From", "Sender", "Email From"]) || '';
    const subject = getEmailField(email, ["Subject", "Email Subject"]) || '';

    const keys = [];

    /* Primary: Message_ID — stable, globally unique */
    if (messageId) keys.push('msgid:' + messageId.toLowerCase());

    /* Fallback: date|sender|subject — backward compat with stored labels */
    const canonical = normalizeEmailKey([date, sender, subject]);
    if (canonical.replace(/\|/g, '').trim()) keys.push(canonical);

    /* Always return at least one key */
    if (keys.length === 0) keys.push(canonical);

    return keys;
}

function extractEmailResults(response) {
    if (typeof response === "string") {
        try {
            return extractEmailResults(JSON.parse(response));
        } catch (err) {
            return [];
        }
    }

    if (Array.isArray(response)) return response;

    const candidates = [
        response?.data,
        response?.results,
        response?.emails,
        response?.records,
        response?.rows,
        response?.result
    ];

    for (const candidate of candidates) {
        if (typeof candidate === "string") {
            const parsed = extractEmailResults(candidate);
            if (parsed.length) return parsed;
        }
    }

    const directMatch = candidates.find(Array.isArray);
    if (directMatch) return directMatch;

    if (response && typeof response === "object") {
        const nestedMatch = Object.values(response).find(Array.isArray);
        if (nestedMatch) return nestedMatch;
    }

    return [];
}

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPxR7fokp5FQr5YDmJmbqOvRaF3h6gyL-CxIWysyvTBj_ncCewz44oXy3ARUMHXkrxhw/exec";

let loading = false;
let timeoutRef = null;
let lastCount = 0;
let scanStartTime = 0;

function getHighResolutionTime() {
    return Date.now();
}

function computeEmailTimingMetrics(startMs, endMs, emailCount, responseData = {}) {
    const elapsedSeconds = Math.max((endMs - startMs) / 1000, 0);
    const averagePredictionTimeSeconds = emailCount > 0 ? elapsedSeconds / emailCount : 0;
    const throughputEmailsPerSecond = elapsedSeconds > 0 ? emailCount / elapsedSeconds : 0;
    const averageResponseTimeSeconds = responseData?.processingTime || responseData?.scanTime || responseData?.timeElapsed || elapsedSeconds;

    return {
        startedAt: new Date(startMs).toISOString(),
        endedAt: new Date(endMs).toISOString(),
        durationSeconds: elapsedSeconds,
        emailCount: emailCount,
        averagePredictionTimeSeconds,
        averageResponseTimeSeconds,
        throughputEmailsPerSecond,
        sourceResponseData: {
            processingTime: responseData?.processingTime,
            scanTime: responseData?.scanTime,
            timeElapsed: responseData?.timeElapsed
        }
    };
}

function saveEmailSessionTiming(timing) {
    const payload = {
        ...timing,
        savedAt: new Date().toISOString()
    };
    localStorage.setItem("emailSessionTiming", JSON.stringify(payload));
    console.log('[TIMING] saved emailSessionTiming payload:', payload);
}

// 🚀 LOAD RESULTS
function loadResults() {
    if (loading) return;
    loading = true;
    scanStartTime = Date.now();

    const sortType =
        document.getElementById("sortOrder")?.value || "newest";

    logActivity("Loading saved email results");

    const table = document.getElementById("resultsTable");

    table.innerHTML = `
        <tr>
            <td colspan="10" class="center">Checking latest emails...</td>
        </tr>
    `;

    const oldScript = document.getElementById("jsonpScript");
    if (oldScript) oldScript.remove();

    const script = document.createElement("script");
    script.id = "jsonpScript";

    script.src =
        SCRIPT_URL +
        "?action=scanAndGetResults&callback=handleData&sort=" +
        encodeURIComponent(sortType) +
        "&t=" +
        Date.now();

    script.onerror = function () {
        loading = false;
        clearTimeout(timeoutRef);
        console.log('[LOAD] JSONP call failed, attempting to load cached data');
        loadCachedOrTestData();
    };

    clearTimeout(timeoutRef);

    timeoutRef = setTimeout(() => {
        const oldScript = document.getElementById("jsonpScript");
        if (oldScript) oldScript.remove();

        loading = false;
        console.log('[LOAD] JSONP timeout, attempting to load cached data');
        loadCachedOrTestData();
    }, 10000);

    document.body.appendChild(script);
}

/* ── Strips any Actual_Label that came from the backend (not from the
   user). Labels must come ONLY from the actualEmailLabels store so the
   baseline is always "Unknown" unless the user explicitly selected one. */
function applyOnlyUserLabels(emails) {
    const userLabels = getActualLabels();
    return (Array.isArray(emails) ? emails : []).map(email => {
        const userLabel = normalizeActualLabel(getStoredActualLabel(email, userLabels));
        if (userLabel) return { ...email, Actual_Label: userLabel };
        /* Not in user-set store → clear any backend-provided Actual_Label */
        const e = { ...email };
        delete e.Actual_Label;
        return e;
    });
}

/* ── Live label counter shown in the page header ── */
function updateLabelCounter() {
    const counter = document.getElementById('labelCounter');
    if (!counter || !currentResults.length) return;

    const total    = currentResults.length;
    const phishing = currentResults.filter(e => normalizeActualLabel(e.Actual_Label) === 'PHISHING').length;
    const safe     = currentResults.filter(e => normalizeActualLabel(e.Actual_Label) === 'SAFE').length;
    const labeled  = phishing + safe;
    const unknown  = total - labeled;

    const el = id => document.getElementById(id);
    if (el('labelCountLabeled')) el('labelCountLabeled').textContent = labeled;
    if (el('labelCountTotal'))   el('labelCountTotal').textContent   = total;
    if (el('labelCountPhishing'))el('labelCountPhishing').textContent= phishing;
    if (el('labelCountSafe'))    el('labelCountSafe').textContent    = safe;
    if (el('labelCountUnknown')) el('labelCountUnknown').textContent = unknown;

    counter.style.display = 'block';
    console.log(`[LABELS] ${labeled}/${total} labeled | ${phishing} phishing | ${safe} safe | ${unknown} unknown`);
}

function loadCachedOrTestData() {
    console.log('[CACHE] Checking for cached email results...');
    const cached = dedupeEmails(getAllEmailAnalysisResults());
    if (cached && cached.length > 0) {
        console.log('[CACHE] Found', cached.length, 'cached records after dedupe');
        latestBackendCount = cached.length;
        currentResults = cached.slice(0, MAX_EMAILS_TO_SHOW);
        /* Apply ONLY user-set labels — strips any backend Actual_Label */
        currentResults = applyOnlyUserLabels(currentResults);
        console.log('[CACHE] After applyOnlyUserLabels — labeled:',
            currentResults.filter(e => e.Actual_Label).length,
            '| unlabeled:', currentResults.filter(e => !e.Actual_Label).length);
        renderTable(currentResults);
        updateLabelCounter();
        syncReportDataFromResults(currentResults);

        const now = new Date();
        saveEmailSessionTiming(computeEmailTimingMetrics(now.getTime() - 2000, now.getTime(), currentResults.length, {}));
        logActivity(`Loaded ${currentResults.length} cached emails (live data unavailable)`);
        loading = false;
        setTotalCount();
        return;
    }

    console.log('[CACHE] No cached data found, showing error');
    showError("Failed to load email results. Check your connection or use cached data.");
}


// ✅ HANDLE DATA
function handleData(data) {
    const backendEmails = dedupeEmails(extractEmailResults(data));
    latestBackendCount = backendEmails.length;
    currentResults = backendEmails.slice(0, MAX_EMAILS_TO_SHOW);
    console.log('[HANDLE] Fresh backend data: returned=', backendEmails.length,
        '| displayed=', currentResults.length,
        '| backend Actual_Label count (stripped):', backendEmails.filter(e=>e.Actual_Label).length);
    /* Strip any Actual_Label from backend — user is the only source of truth */
    currentResults = applyOnlyUserLabels(currentResults);
    console.log('[HANDLE] After applyOnlyUserLabels:',
        currentResults.filter(e=>e.Actual_Label).length, 'user-labeled |',
        currentResults.filter(e=>!e.Actual_Label).length, 'unknown');
    const endTime = Date.now();
    const timingMetrics = computeEmailTimingMetrics(scanStartTime, endTime, currentResults.length, data);
    console.log('[TIMING] email-results computed timingMetrics:', timingMetrics);

    const phishingCount = currentResults.filter(e => normalizeCategory(e) === "PHISHING").length;
    const potentialCount = currentResults.filter(e => normalizeCategory(e) === "POTENTIAL_PHISHING").length;
    const alertCount = phishingCount + potentialCount;
    logActivity(`Scanned ${currentResults.length} emails, detected ${alertCount} alerts`);
    clearTimeout(timeoutRef);

    syncReportDataFromResults(currentResults);
    saveSnapshot();
    saveEmailSessionTiming(timingMetrics);
    document.getElementById("totalCount").innerText = currentResults.length;

    if (currentResults.length > lastCount) {
        logActivity(`New emails detected: +${currentResults.length - lastCount}`);
    }
    lastCount = currentResults.length;

    const table = document.getElementById("resultsTable");

    if (!data || data.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="10" class="center">
                    No new emails
                </td>
            </tr>
        `;
        loading = false;
        scanStartTime = 0;
        return;
    }

    applySorting();
    updateLabelCounter();
    setTotalCount();

    lucide.createIcons();
    loading = false;
    scanStartTime = 0;
}

function applySorting() {
    if (!currentResults.length) return;

    const sortType =
        document.getElementById("sortOrder")?.value || "newest";

    const getTime = email =>
        Number(email.Date_Timestamp || Date.parse(email.Date) || 0);

    let sorted = [...currentResults];

    switch (sortType) {
        case "newest":
            sorted.sort((a, b) => getTime(b) - getTime(a));
            break;

        case "oldest":
            sorted.sort((a, b) => getTime(a) - getTime(b));
            break;

        case "az":
            sorted.sort((a, b) =>
                (a.From || "").localeCompare(b.From || "")
            );
            break;

        case "za":
            sorted.sort((a, b) =>
                (b.From || "").localeCompare(a.From || "")
            );
            break;
    }

    renderTable(sorted);
}

function renderTable(data) {
    const table = document.getElementById("resultsTable");
    table.innerHTML = "";

    data.forEach(email => {
        let statusClass = "status-safe";
        const category = normalizeCategory(email);

        if (category === "PHISHING")
            statusClass = "status-danger";
        else if (category === "POTENTIAL_PHISHING")
            statusClass = "status-warning";

        const emailKey = getEmailKey(email);
        const actualLabel = getActualLabel(email);

        table.innerHTML += `
        <tr>
            <td>${escapeHtml(email.Date || "-")}</td>
            <td>${escapeHtml(email.From || "-")}</td>
            <td>${escapeHtml(email.Subject || "-")}</td>
            <td class="${statusClass}">${escapeHtml(email.Category_Label || email.Category || "-")}</td>
            <td>
                <select class="actual-label-select" data-email-key="${escapeHtml(emailKey)}" onchange="updateActualLabel(this.dataset.emailKey, this.value)">
                    <option value="" ${actualLabel === "" ? "selected" : ""}>Unknown</option>
                    <option value="SAFE" ${actualLabel === "SAFE" ? "selected" : ""}>Safe</option>
                    <option value="PHISHING" ${actualLabel === "PHISHING" ? "selected" : ""}>Phishing</option>
                </select>
            </td>
            <td>${escapeHtml(email.Risk || "-")}</td>
            <td>${escapeHtml(email.Confidence || "-")}</td>
            <td>${formatUrls(email.URLs)}</td>
            <td>${escapeHtml(email.Thread_ID || "-")}</td>
        </tr>
        `;
    });
}

/* ── SNAPSHOT ──────────────────────────────────────────────────────
   Write a clean, simple copy of exactly what is shown in the table
   to a dedicated key. Reports.html reads ONLY this key, so it always
   matches what the user sees here regardless of Google Sheets state. */
function saveSnapshot() {
    if (!Array.isArray(currentResults) || currentResults.length === 0) return;
    const snap = {
        savedAt: Date.now(),
        backendCount: latestBackendCount || currentResults.length,
        displayCount: currentResults.length,
        emails: currentResults.map(email => {
            const cat = normalizeCategory(email);
            const actualLabel = getActualLabel(email) || '';
            /* Use the same display text that renderTable shows */
            const catLabel = email.Category_Label || email.Category ||
                (cat === 'PHISHING' ? 'Phishing' :
                 cat === 'POTENTIAL_PHISHING' ? 'Potential Phishing' : 'Safe');
            return {
                from:          email.From    || '-',
                subject:       email.Subject || '-',
                date:          email.Date    || '-',
                category:      cat,          /* 'PHISHING' | 'POTENTIAL_PHISHING' | 'SAFE' */
                categoryLabel: catLabel,     /* text shown in table Category column */
                actualLabel:   actualLabel   /* user's dropdown selection or '' */
            };
        })
    };
    localStorage.setItem('securetrace_snapshot', JSON.stringify(snap));
    console.log('[SNAP] saved', snap.emails.length, 'emails to securetrace_snapshot',
        '| backendCount=', snap.backendCount, '| displayCount=', snap.displayCount);
}

// 🔗 FORMAT URLS (clean + clickable)
function formatUrls(urls) {
    if (!urls) return "-";

    return urls.split(/[;,]+/).map(url => {
        url = url.trim();
        if (!url) return "";

        const safeUrl = escapeHtml(url);
        const displayText = escapeHtml(getUrlDisplayText(url));

        return `<a href="${safeUrl}" target="_blank" title="${safeUrl}">${displayText}</a>`;
    }).filter(Boolean).join("<br>");
}

// ❌ ERROR DISPLAY
function getUrlDisplayText(url) {
    try {
        const parsed = new URL(url);
        const path = parsed.pathname === "/" ? "" : parsed.pathname;
        let display = `${parsed.hostname}${path}`;

        if (display.length > 32) {
            display = display.slice(0, 29) + "...";
        }

        return display;
    } catch (err) {
        return url.length > 32 ? url.slice(0, 29) + "..." : url;
    }
}

function escapeHtml(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function showError(message) {
    const table = document.getElementById("resultsTable");

    table.innerHTML = `
        <tr>
            <td colspan="9" class="center" style="color:red;">
                ${message}
            </td>
        </tr>
    `;

    loading = false;
}


// 🌐 GO TO LIVE REPORTS
function persistCurrentLabels() {
    // Rebuild the label map fresh from every email in currentResults that has a label.
    // Starting from scratch (not merging) ensures no stale or mismatched keys survive.
    const labels = {};

    if (Array.isArray(currentResults) && currentResults.length) {
        currentResults.forEach(email => {
            const actual = normalizeActualLabel(email.Actual_Label);
            if (!actual) return;
            getEmailKeys(email).forEach(key => {
                labels[key] = actual;
            });
        });
    }

    saveActualLabels(labels);
    console.log('[PERSIST] persistCurrentLabels wrote', Object.keys(labels).length, 'labeled entries to actualEmailLabels');

    if (Array.isArray(currentResults) && currentResults.length) {
        currentResults = mergeStoredActualLabelsIntoResults(currentResults);
        localStorage.setItem('emailAnalysisResults', JSON.stringify(currentResults));
    }
}

function goReports() {
    saveSnapshot(); /* always write fresh snapshot before navigating */
    /* Save every current email to localStorage with _category stamped.
       syncReportDataFromResults uses email-results.html's own normalizeCategory
       (reads specific named fields only, no keyword scanning) so the value is
       exactly what the user sees in this table.  persistCurrentLabels also
       runs inside sync to flush Actual_Label selections. */
    if (Array.isArray(currentResults) && currentResults.length > 0) {
        syncReportDataFromResults(currentResults);
    }
    persistCurrentLabels();
    const labeled = currentResults.filter(e => normalizeActualLabel(e.Actual_Label) !== '');
    if (labeled.length > 0) {
        localStorage.setItem('autoRunEval', '1');
    }
    /* Signal that fresh data is waiting — reports.html will skip its
       Google Sheets auto-fetch and read directly from localStorage. */
    sessionStorage.setItem('securetrace_from_results', Date.now().toString());
    logActivity("Navigated to reports page");
    window.open("reports.html", "_top");
}

// Initial load
initActivityTracking();
logActivity("Visited email results page");
resetProjectCountsOnce();
loadResults();

/* Auto-persist labels whenever the user leaves the page — even if they
   navigate directly instead of using the "Go to Reports" button. */
window.addEventListener('beforeunload', persistCurrentLabels);
</script>
