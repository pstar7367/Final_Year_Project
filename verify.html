<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: linear-gradient(to right, #eef4ff, #f8fbff);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.card {
    background: #fff;
    padding: 40px;
    width: 360px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    text-align: center;
}

.icon-circle {
    width: 70px;
    height: 70px;
    background: #e6efff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

h2 {
    margin-bottom: 10px;
}

p {
    color: #666;
    margin-bottom: 20px;
}

/* Input */
input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    font-size: 16px;
    text-align: center;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(to right, #2b6cff, #4c8dff);
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* Error */
.error {
    color: red;
    margin-top: 10px;
    font-size: 14px;
}

/* Mobile */
@media (max-width: 768px) {
    .card {
        width: 90%;
        padding: 25px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="icon-circle">
        <i data-lucide="mail"></i>
    </div>

    <h2>Email Verification</h2>

    <p id="message"></p>

    <input type="text" id="codeInput" placeholder="Enter 6-digit code" maxlength="6">

    <button onclick="verifyCode()">Verify</button>

    <div class="error" id="error"></div>

</div>

<script>
lucide.createIcons();

// Get email from storage
const email = localStorage.getItem("userEmail");

if (!email) {
    document.getElementById("message").innerText =
        "No email found. Please go back and try again.";
}

// Show email
document.getElementById("message").innerText =
    "A verification code has been sent to " + email;

const input = document.getElementById("codeInput");
const errorBox = document.getElementById("error");
const btn = document.querySelector("button");

// Only allow numbers
input.addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, "");
});

// VERIFY FUNCTION
async function verifyCode() {
    const code = input.value.trim();

    errorBox.innerText = "";

    if (code.length !== 6) {
        errorBox.innerText = "Enter a valid 6-digit code";
        return;
    }

    btn.textContent = "Verifying...";
    btn.disabled = true;

    try {
        const res = await fetch("https://final-year-project-eobc.onrender.com/verify-code", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, code })
        });

        const data = await res.json();

        console.log("VERIFY RESPONSE:", data);

        if (data.success) {
            window.location.href = "email-results.html";
        } else {
            errorBox.innerText = data.message || "Invalid code";
        }

    } catch (err) {
        console.log("VERIFY ERROR:", err);
        errorBox.innerText = "Network error. Try again.";
    }

    btn.textContent = "Verify";
}
</script>

   </body>
</html>
